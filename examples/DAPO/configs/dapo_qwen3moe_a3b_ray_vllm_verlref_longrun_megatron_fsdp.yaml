# Megatron FSDP twin of dapo_qwen3moe_a3b_ray_vllm_verlref_longrun.yaml.
#
# Identical except for how the policy is trained:
#   - policy.training_backend: fsdp2 -> megatron_native with
#     megatron_cfg.data_parallel: megatron_fsdp (TP=PP=CP=1, EP=8).
#   - Full activation recompute in place of the FSDP2 gradient checkpointing.
#   - Memory, as in the Megatron DDP MoE long run (the optimization problem
#     is unchanged): max_tokens_per_gpu 8192 and vLLM
#     gpu_memory_utilization 0.25.
#   - moe_router_dtype: null keeps the trainer's router in BF16; keep
#     LUMENRL_FP32_MOE_ROUTER=0 for the rollout side, as before.
#   - Checkpoint saving and resume off (not supported with Megatron FSDP yet).
#
# Launch with MODEL_PATH set to the model below; run_dapo.sh otherwise
# substitutes Qwen3-8B-Base.
#
# ---- original header ----
# Qwen3-30B-A3B-Base BF16 baseline for verl's FP8-E2E MoE reference experiment.
#
# Ports verl `recipe/low_precision/run_dapo_qwen3_moe_30b_megatron_fp8e2e.sh`
# (docs/low_precision/fp8.md, "FP8 End-to-End -> Qwen3-30B-A3B MoE Model") onto
# the LumenRL FSDP2 + colocated vLLM stack in BF16. verl's figure has three
# curves -- BF16, FP8 E2E, FP8-rollout-only -- and this config targets the BF16
# one, so it is the baseline the FP8 curves are judged against.
#
# Every hyper-parameter below is taken verbatim from that script:
#   prompt/response 2048/20480, train_prompt_bsz 128, n 16, gen_prompt_bsz 384,
#   mini_bsz == bsz (one update per rollout), grpo, token-mean, clip 0.2/0.28/10,
#   lr 1e-6, wd 0.1, clip_grad 1.0, entropy_coeff 0, NO lr warmup
#   (lr_warmup_steps_ratio=0.0), overlong_buffer 512/1.0, filter_groups acc/10,
#   token-level TIS with C=2.0, temperature/top_p/top_k 1.0/1.0/-1, test_freq 10.
#
# The BF16 MoE router is deliberate, not an oversight -- verl leaves
# `moe_router_dtype=fp32` commented out with the note that vLLM's Qwen3-MoE
# router is BF16 and fp32 brought no accuracy gain. Our own A/B agreed (15k
# tokens, no statistically significant difference), so the reproduction runs
# BF16 on both sides: export LUMENRL_FP32_MOE_ROUTER=0. R3 is off for the same
# reason -- verl's recipe does not have it, and this config exists to match.
#
# Deviations forced by hardware/stack, all of which change throughput rather
# than the optimization problem:
#   - 8xMI350X, not 2x8 H100. Same global batch, half the GPUs, so ~2x step time.
#   - vLLM TP=1 per colocated replica (verl uses gen_tp=2 across 16 GPUs).
#   - gpu_memory_utilization 0.30, not verl's 0.5: verl offloads params/optimizer
#     to CPU during generation, which the LumenRL Ray path cannot do, so the
#     training memory stays resident and vLLM gets a smaller share.
#   - Validation is greedy here; verl samples at temperature 0.6, top_p 1.0, n=1.
#     Diagnostic only, does not touch training.

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: "${oc.env:DATA_ROOT}/models/Qwen3-30B-A3B-Base"
  training_backend: megatron_native
  generation_backend: vllm
  max_total_sequence_length: 22528      # verl max_prompt 2048 + max_response 20480
  max_response_length: 20480
  train_global_batch_size: 2048         # verl train_prompt_bsz 128 x n 16
  gen_batch_size: 384                   # verl gen_prompt_bsz = 128 * 3
  train_micro_batch_size: 1             # verl ppo_micro_batch_size_per_gpu 1
  max_token_len_per_gpu: 22528          # verl actor_ppo_max_token_len
  learning_rate: 1.0e-6
  lr_warmup_steps: 0                    # verl lr_warmup_steps_ratio 0.0 -> no warmup
  weight_decay: 0.1
  max_grad_norm: 1.0                    # verl clip_grad
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16               # COMPUTE dtype; master weights stay fp32
    megatron_cfg:
      # Megatron FSDP: parameters, gradients, FP32 master and Adam state
      # sharded across the data-parallel ranks; gradients reduced in FP32.
      data_parallel: megatron_fsdp
      data_parallel_sharding_strategy: optim_grads_params
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      # 128 experts split across the 8 GPUs; attention is data-parallel over 8.
      expert_model_parallel_size: 8
      moe_grouped_gemm: false
      moe_token_dispatcher_type: alltoall
      moe_flex_dispatcher_backend: mori
      moe_mori_max_tokens_per_rank: null
      moe_mori_kernel_type: null
      moe_aux_loss_coeff: 0.0
      # BF16 router, as in the FSDP2 run; null means no FP32 upcast.
      moe_router_dtype: null
      # Full recompute, one layer at a time: the counterpart of the FSDP2
      # backend's gradient checkpointing.
      recompute_granularity: full
      recompute_method: uniform
      recompute_num_layers: 1
      log_probs_chunk_size: 1024
      enable_dynamic_batch: true
      # Packing budget per microbatch, as in the Megatron DDP MoE long run:
      # at 22528 one microbatch materializes [22528, vocab] logits with
      # grad and runs out of memory in the first step.
      max_tokens_per_gpu: 8192
    fsdp_cfg:
      # verl sets param/optimizer/grad offload=True, which frees room for
      # gpu_memory_utilization=0.5. FSDP2 CPU offload is broken in the LumenRL
      # Ray worker path ("parameters should be materialized on CPU"), so we keep
      # everything resident and give vLLM 0.30 instead.
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: true
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      # verl uses 0.5, which it can afford because it offloads params/optimizer
      # to CPU during generation; the LumenRL Ray path keeps them resident.
      #
      # 0.40 was tried and does not hold: vLLM takes ~101GB of the 252GiB card,
      # the actor's allocator high-water mark reaches 117.6GB, and the ~33GB left
      # is not enough for RCCL's buffers and the HSA runtime. A 101-step run died
      # with HSA_STATUS_ERROR_OUT_OF_RESOURCES ("Available Free mem : 0 MB") in a
      # collective. Live memory was flat throughout (allocated 42.8GB,
      # max_allocated 75.6GB) -- the growth is allocator fragmentation, +0.086
      # GB/step. At 0.30 the headroom is ~59GB instead.
      # 0.25 as in the Megatron DDP MoE long run: frees ~14 GB per GPU for
      # training at the cost of about half the generation concurrency.
      gpu_memory_utilization: 0.25
      max_model_len: 22528
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 32768
      max_num_seqs: 256
      quantization: ""                  # BF16 baseline; verl's FP8 arm sets fp8
      calculate_log_probs: true         # verl rollout.calculate_log_probs
      enable_sleep_mode: false
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1

# BF16 router on both sides, matching verl. Also requires
# LUMENRL_FP32_MOE_ROUTER=0 in the environment, which is what actually switches
# the matmul precision; this block only controls Rollout Routing Replay.
moe:
  r3:
    rollout_replay: false               # verl's recipe has no router replay

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16                 # verl n_resp_per_prompt
    kl_coeff: 0.0                       # verl use_kl_loss=False, kl_coef=0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 20480
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 512
      penalty_factor: 1.0
      log: false

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token                   # verl rollout_is=token
    rollout_is_threshold: 2.0           # verl C=2
    rollout_is_batch_normalize: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  # The directory name says 1024 because that was the budget it was filtered at,
  # but re-filtering DAPO-Math-17k at verl's max_prompt_length=2048 removes
  # nothing: 1,791,700 rows in, 1,791,700 out (AIME: 960 -> 960). No prompt in
  # this dataset exceeds 1024 tokens under the Qwen3 tokenizer, so the two cuts
  # are the same data and this file matches what verl trains on.
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

# verl trainer.test_freq=10 on AIME-2024.
val_dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/aime-2024.filtered.parquet"
val_steps: 10
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0

checkpointing:
  # Megatron FSDP cannot save distributed checkpoints yet, so saving and
  # resuming are off: save_steps is past the end of any run.
  checkpoint_dir: "${oc.env:SCRATCH_ROOT}/ckpts/lumenrl-dapo/verlref-moe-a3b-bf16-megatron-fsdp"
  save_steps: 1000000
  save_total_limit: 1
  resume: false

logger:
  wandb_enabled: true
  log_interval: 1
  wandb:
    project: LUMEN-RL-MOE
    name: verlref-moe-a3b-bf16-B128-R20K-TIS-megatron-fsdp

num_training_steps: 1000
seed: 10086
