# 1-step Megatron-Native + ATOM R3 smoke.
# Hard-assignment replay of ATOM generate() routed_experts (native
# enable_return_routed_experts). Native capture is CUDA-graph-safe.
# Watch r3_verify/frac_abs_gt_0.1 vs an R3-off run.
#
# Launch with MODE=atombf16 so PYTHONPATH includes ATOM. Mount the ATOM
# tree that contains enable_return_routed_experts (e.g. /home/sugovind/ATOM).
# gpu_memory_utilization must leave ATOM KV room after colocated Megatron
# (0.35 left available_for_kv=0). MODE=atombf16 enables sleep_level=2 so
# KV is released before fused Adam. The metric is logged before the
# optimizer step.

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: "${oc.env:DATA_ROOT}/models/Qwen3-30B-A3B-Base"
  training_backend: megatron_native
  generation_backend: atom
  max_total_sequence_length: 1024
  max_response_length: 256
  train_global_batch_size: 64
  gen_batch_size: 8
  train_micro_batch_size: 1
  max_token_len_per_gpu: 2048
  learning_rate: 1.0e-6
  lr_warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    megatron_cfg:
      use_distributed_optimizer: true
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 8
      moe_grouped_gemm: false
      moe_token_dispatcher_type: alltoall
      moe_flex_dispatcher_backend: mori
      moe_mori_max_tokens_per_rank: null
      moe_mori_kernel_type: null
      moe_aux_loss_coeff: 0.0
      moe_router_dtype: fp32
      log_probs_chunk_size: 512
      enable_dynamic_batch: false
      max_tokens_per_gpu: 2048
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
  generation:
    atom_cfg:
      transport: ray_http
      tensor_parallel_size: 1
      kv_cache_dtype: bf16
      gpu_memory_utilization: 0.50
      enable_prefix_caching: false
      online_quant_config: {}
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.50
      max_model_len: 1024
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 2048
      max_num_seqs: 32
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: false
      sleep_level: 2
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1

moe:
  r3:
    enabled: true
    record_router_logits: false
    replay_mode: hard_assignment

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 8
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: false
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 256
    filter_groups:
      enable: false
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 128
      penalty_factor: 1.0
      log: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

checkpointing:
  checkpoint_dir: "${oc.env:DATA_ROOT}/ckpts/lumenrl-dapo/megatron-moe-r3-atom-smoke"
  save_steps: 999
  save_total_limit: 1
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 1
seed: 10086
